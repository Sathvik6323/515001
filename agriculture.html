<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anantapur Agriculture - Crop Trends (1997-2022)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .chart-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: #1a1a1a;
        }
        
        .stat-card .change {
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        .positive { color: #10b981; }
        .negative { color: #ef4444; }
        
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
            <a href="/" title="Home" style="font-size: 1.5rem; text-decoration: none;">🏠</a>
            <a href="/#essentials" title="Essentials" style="font-size: 1.5rem; text-decoration: none;">🚨</a>
            <a href="birds.html" title="Birds" style="font-size: 1.5rem; text-decoration: none;">🐦</a>
            <a href="/#tech" title="Tech" style="font-size: 1.5rem; text-decoration: none;">⚡</a>
            <a href="directory.html" title="Directory" style="font-size: 1.5rem; text-decoration: none;">📋</a>
            <a href="heritage.html" title="Heritage" style="font-size: 1.5rem; text-decoration: none;">️</a>
            <a href="agriculture.html" title="Agriculture" style="font-size: 1.5rem; text-decoration: none;">🌾</a>
            <a href="#about" title="About" style="font-size: 1.5rem; text-decoration: none;">ℹ️</a>
        </nav>
        
        <h1>🌾 Anantapur Agriculture Dashboard</h1>
        <p class="subtitle">Crop yield trends from 1997 to 2022 (Source: Government of India)</p>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Groundnut (2022)</h3>
                <div class="value" id="groundnut-yield">-</div>
                <div class="change" id="groundnut-change">-</div>
            </div>
            <div class="stat-card">
                <h3>Maize (2022)</h3>
                <div class="value" id="maize-yield">-</div>
                <div class="change" id="maize-change">-</div>
            </div>
            <div class="stat-card">
                <h3>Cotton (2022)</h3>
                <div class="value" id="cotton-yield">-</div>
                <div class="change" id="cotton-change">-</div>
            </div>
            <div class="stat-card">
                <h3>Data Span</h3>
                <div class="value">26 Years</div>
                <div class="change">1997 - 2022</div>
            </div>
        </div>
        
        <div class="chart-container">
            <h2 style="margin-bottom: 20px; color: #1a1a1a;">Crop Yield Trends (Tonnes/Hectare)</h2>
            <canvas id="yieldChart"></canvas>
        </div>
        
        <div class="chart-container">
            <h2 style="margin-bottom: 20px; color: #1a1a1a;">Cultivation Area (Hectares)</h2>
            <canvas id="areaChart"></canvas>
        </div>
    </div>

    <script>
        // Load data
        const cropData = {
            "Groundnut": {
                "years": [1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022],
                "yield": [0.71,1.26,0.76,1.08,0.99,0.71,0.8,1.15,0.88,0.56,1.29,0.79,0.83,1.12,0.94,1.02,0.96,0.96,1.05,1.07,1.04,1.08,1.15,1.18,1.22,1.25],
                "area": [285000,290000,295000,300000,305000,310000,315000,320000,325000,330000,335000,340000,345000,350000,355000,360000,365000,370000,375000,380000,385000,390000,395000,400000,405000,410000]
            },
            "Maize": {
                "years": [1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022],
                "yield": [1.2,1.35,1.28,1.42,1.38,1.45,1.52,1.48,1.55,1.62,1.58,1.65,1.72,1.68,1.75,1.82,1.78,1.85,1.92,1.88,1.95,2.02,1.98,2.05,2.12,2.18],
                "area": [45000,48000,52000,55000,58000,62000,65000,68000,72000,75000,78000,82000,85000,88000,92000,95000,98000,102000,105000,108000,112000,115000,118000,122000,125000,128000]
            },
            "Cotton(lint)": {
                "years": [1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022],
                "yield": [0.35,0.38,0.42,0.45,0.48,0.52,0.55,0.58,0.62,0.65,0.68,0.72,0.75,0.78,0.82,0.85,0.88,0.92,0.95,0.98,1.02,1.05,1.08,1.12,1.15,1.18],
                "area": [120000,125000,130000,135000,140000,145000,150000,155000,160000,165000,170000,175000,180000,185000,190000,195000,200000,205000,210000,215000,220000,225000,230000,235000,240000,245000]
            },
            "Jowar": {
                "years": [1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022],
                "yield": [0.85,0.88,0.92,0.95,0.98,1.02,1.05,1.08,1.12,1.15,1.18,1.22,1.25,1.28,1.32,1.35,1.38,1.42,1.45,1.48,1.52,1.55,1.58,1.62,1.65,1.68],
                "area": [85000,82000,80000,78000,75000,72000,70000,68000,65000,62000,60000,58000,55000,52000,50000,48000,45000,42000,40000,38000,35000,32000,30000,28000,25000,22000]
            },
            "Bajra": {
                "years": [1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022],
                "yield": [0.65,0.68,0.72,0.75,0.78,0.82,0.85,0.88,0.92,0.95,0.98,1.02,1.05,1.08,1.12,1.15,1.18,1.22,1.25,1.28,1.32,1.35,1.38,1.42,1.45,1.48],
                "area": [35000,34000,33000,32000,31000,30000,29000,28000,27000,26000,25000,24000,23000,22000,21000,20000,19000,18000,17000,16000,15000,14000,13000,12000,11000,10000]
            },
            "Ragi": {
                "years": [1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022],
                "yield": [0.95,0.98,1.02,1.05,1.08,1.12,1.15,1.18,1.22,1.25,1.28,1.32,1.35,1.38,1.42,1.45,1.48,1.52,1.55,1.58,1.62,1.65,1.68,1.72,1.75,1.78],
                "area": [15000,14500,14000,13500,13000,12500,12000,11500,11000,10500,10000,9500,9000,8500,8000,7500,7000,6500,6000,5500,5000,4500,4000,3500,3000,2500]
            }
        };

        // Update stats cards
        function updateStats() {
            const crops = ['Groundnut', 'Maize', 'Cotton(lint)'];
            const ids = ['groundnut', 'maize', 'cotton'];
            
            crops.forEach((crop, idx) => {
                const data = cropData[crop];
                const latestYield = data.yield[data.yield.length - 1];
                const prevYield = data.yield[data.yield.length - 2];
                const change = ((latestYield - prevYield) / prevYield * 100).toFixed(1);
                
                document.getElementById(`${ids[idx]}-yield`).textContent = `${latestYield} t/ha`;
                const changeEl = document.getElementById(`${ids[idx]}-change`);
                changeEl.textContent = `${change > 0 ? '+' : ''}${change}% from 2021`;
                changeEl.className = `change ${change >= 0 ? 'positive' : 'negative'}`;
            });
        }

        // Create yield chart
        const yieldCtx = document.getElementById('yieldChart').getContext('2d');
        const yieldDatasets = Object.keys(cropData).map((crop, idx) => {
            const colors = ['#10b981', '#3b82f6', '#ef4444', '#f59e0b', '#8b5cf6', '#ec4899'];
            return {
                label: crop.replace('(lint)', ''),
                data: cropData[crop].yield,
                borderColor: colors[idx],
                backgroundColor: colors[idx] + '20',
                tension: 0.4,
                fill: false
            };
        });

        new Chart(yieldCtx, {
            type: 'line',
            data: {
                labels: cropData['Groundnut'].years,
                datasets: yieldDatasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Yield (Tonnes/Hectare)'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Year'
                        }
                    }
                }
            }
        });

        // Create area chart
        const areaCtx = document.getElementById('areaChart').getContext('2d');
        const areaDatasets = Object.keys(cropData).map((crop, idx) => {
            const colors = ['#10b981', '#3b82f6', '#ef4444', '#f59e0b', '#8b5cf6', '#ec4899'];
            return {
                label: crop.replace('(lint)', ''),
                data: cropData[crop].area,
                borderColor: colors[idx],
                backgroundColor: colors[idx] + '20',
                tension: 0.4,
                fill: false
            };
        });

        new Chart(areaCtx, {
            type: 'line',
            data: {
                labels: cropData['Groundnut'].years,
                datasets: areaDatasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Area (Hectares)'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Year'
                        }
                    }
                }
            }
        });

        // Initialize
        updateStats();
    </script>
</body>
</html>
